<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓咪吃大便 (Cat vs Poop)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0e6d2; /* 米色背景 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        #gameCanvas {
            background-color: #fff8e7;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            cursor: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 24px; color: #d35400; }
        p { margin: 5px 0 0; color: #555; }
        #score { font-size: 20px; font-weight: bold; color: #d35400; }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            display: none;
            border: 3px solid #d35400;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        button {
            background: #d35400;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover {
            background: #e67e22;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>貓咪吃大便 💩</h1>
        <p>分數: <span id="score">0</span> 坨</p>
        <p style="font-size: 14px; opacity: 0.7;">移動滑鼠控制貓咪，避開可怕的小黃瓜！</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOver">
        <h2 style="color: #c0392b; font-size: 30px;">貓咪吐了! 🤮</h2>
        <p>你吃了 <span id="finalScore">0</span> 坨大便</p>
        <button onclick="resetGame()">再吃一次</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverEl = document.getElementById('gameOver');

        let width, height;
        let score = 0;
        let gameRunning = true;
        let frameCount = 0;

        // 貓咪
        const player = {
            x: 0,
            y: 0,
            size: 40,
            targetSize: 40,
            speed: 0.1
        };

        const mouse = { x: 0, y: 0 };
        let foods = []; // 大便
        let enemies = []; // 小黃瓜
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        player.x = width / 2;
        player.y = height / 2;
        mouse.x = width / 2;
        mouse.y = height / 2;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        function spawnFood() {
            const size = 30;
            const x = Math.random() * (width - size) + size/2;
            const y = Math.random() * (height - size) + size/2;
            foods.push({ x, y, size, emoji: '💩' });
        }

        function spawnEnemy() {
            const size = 40;
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -size : width + size;
                y = Math.random() * height;
            } else {
                x = Math.random() * width;
                y = Math.random() < 0.5 ? -size : height + size;
            }
            
            const angle = Math.atan2(player.y - y, player.x - x);
            const speed = Math.random() * 3 + 2; // 小黃瓜飛得快一點
            const velocity = {
                x: Math.cos(angle) * speed,
                y: Math.sin(angle) * speed
            };
            // 隨機旋轉角度
            const rotation = Math.random() * Math.PI * 2;
            const rotationSpeed = (Math.random() - 0.5) * 0.1;

            enemies.push({ x, y, size, emoji: '🥒', velocity, rotation, rotationSpeed });
        }

        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 10 + 5,
                    emoji: Math.random() > 0.5 ? '💩' : '✨',
                    velocity: {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    },
                    alpha: 1
                });
            }
        }

        function update() {
            if (!gameRunning) return;

            player.x += (mouse.x - player.x) * player.speed;
            player.y += (mouse.y - player.y) * player.speed;
            
            // 吃越多越大隻
            player.targetSize = 40 + score * 1.5;
            if(player.targetSize > 150) player.targetSize = 150;
            player.size += (player.targetSize - player.size) * 0.1;

            if (frameCount % 40 === 0 && foods.length < 20) spawnFood();

            let spawnRate = 100;
            if (score > 10) spawnRate = 80;
            if (score > 30) spawnRate = 50;
            if (frameCount % spawnRate === 0) spawnEnemy();

            particles.forEach((p, index) => {
                p.x += p.velocity.x;
                p.y += p.velocity.y;
                p.velocity.y += 0.2; // Gravity
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            foods.forEach((food, index) => {
                const dist = Math.hypot(player.x - food.x, player.y - food.y);
                if (dist < player.size/2 + food.size/2) {
                    score++;
                    scoreEl.innerText = score;
                    createParticles(food.x, food.y);
                    foods.splice(index, 1);
                }
            });

            enemies.forEach((enemy, index) => {
                enemy.x += enemy.velocity.x;
                enemy.y += enemy.velocity.y;
                enemy.rotation += enemy.rotationSpeed;

                if (enemy.x < -100 || enemy.x > width + 100 || enemy.y < -100 || enemy.y > height + 100) {
                    enemies.splice(index, 1);
                    return;
                }

                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (dist < player.size/2 + enemy.size/3) { // 碰撞判定稍微寬鬆一點
                    gameOver();
                }
            });

            frameCount++;
            requestAnimationFrame(render);
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.translate(p.x, p.y);
                ctx.font = `${p.size}px Arial`;
                ctx.fillText(p.emoji, 0, 0);
                ctx.restore();
            });

            // Foods
            ctx.font = '30px Arial';
            foods.forEach(food => {
                // 微微浮動動畫
                const floatY = Math.sin(frameCount * 0.1 + food.x) * 5;
                ctx.fillText(food.emoji, food.x, food.y + floatY);
            });

            // Enemies
            enemies.forEach(enemy => {
                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                ctx.rotate(enemy.rotation);
                ctx.font = `${enemy.size}px Arial`;
                ctx.fillText(enemy.emoji, 0, 0);
                ctx.restore();
            });

            // Player
            ctx.font = `${player.size}px Arial`;
            // 翻轉貓咪臉的方向
            ctx.save();
            ctx.translate(player.x, player.y);
            if (mouse.x < player.x) {
                ctx.scale(-1, 1); // 向左看
            }
            ctx.fillText('🐱', 0, 0);
            ctx.restore();

            if (gameRunning) requestAnimationFrame(update);
        }

        function gameOver() {
            gameRunning = false;
            finalScoreEl.innerText = score;
            gameOverEl.style.display = 'block';
            canvas.style.cursor = 'default';
        }

        function resetGame() {
            gameRunning = true;
            score = 0;
            scoreEl.innerText = '0';
            gameOverEl.style.display = 'none';
            canvas.style.cursor = 'none';
            foods = [];
            enemies = [];
            particles = [];
            player.x = width / 2;
            player.y = height / 2;
            player.size = 40;
            update();
        }

        update();
    </script>
</body>
</html>
