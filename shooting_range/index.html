<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>十字架打靶練習場 - 發洩射擊場</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 全螢幕繪製畫布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 覆蓋層 -->
    <div id="ui-container">

        <!-- 手機/平板選單開合浮動按鈕 -->
        <button id="btnTogglePanel" class="floating-btn" title="切換設定選單">⚙️</button>

        <!-- 左上角：自訂人偶與靶場設定 -->
        <div id="controlPanel" class="panel">
            <div class="panel-title">
                <span>🎯</span>
                <span>十字架靶場控制台</span>
            </div>

            <!-- 上傳人偶功能 -->
            <div class="control-group">
                <label class="control-label">自訂人偶 (點擊或直接拖曳圖片進來)：</label>
                <label class="upload-box">
                    <span class="upload-icon">📷</span>
                    <span class="upload-text">點擊上傳自訂頭像 / 人偶</span>
                    <input type="file" id="imageUploadInput" accept="image/*">
                </label>
                <div class="preview-container">
                    <img id="uploadPreview" alt="預覽圖">
                    <span id="uploadStatus">預設呆萌/標靶人偶</span>
                </div>
            </div>

            <!-- 圖片縮放與位置調整 -->
            <div id="imageAdjustControls" class="control-group" style="background: rgba(0, 229, 255, 0.05); padding: 10px; border-radius: 8px; border: 1px solid rgba(0, 229, 255, 0.2);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="control-label" style="margin: 0; color: #00e5ff; font-weight: 600;">🔍 照片在靶內縮放 (Zoom)：</label>
                    <span id="scaleValLabel" style="font-size: 12px; font-weight: bold; color: #ffcc00;">100%</span>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <button id="btnScaleMinus" class="btn" style="padding: 2px 8px; font-size: 13px;">-</button>
                    <input type="range" id="imageScaleSlider" min="0.1" max="10.0" step="0.1" value="1.0" style="flex: 1; accent-color: #00e5ff; cursor: pointer;">
                    <button id="btnScalePlus" class="btn" style="padding: 2px 8px; font-size: 13px;">+</button>
                    <button id="btnScaleReset" class="btn" style="padding: 2px 6px; font-size: 11px;">重設</button>
                </div>

                <!-- 快速比例預設與一鍵全屏按鈕 -->
                <div style="display: flex; gap: 4px; margin-top: 6px;">
                    <button class="btn btn-scale-preset" data-scale="1.0" style="flex: 1; padding: 2px 4px; font-size: 10px;">100%</button>
                    <button class="btn btn-scale-preset" data-scale="3.0" style="flex: 1; padding: 2px 4px; font-size: 10px;">300%</button>
                    <button class="btn btn-scale-preset" data-scale="5.0" style="flex: 1; padding: 2px 4px; font-size: 10px;">500%</button>
                    <button id="btnFullScreenFit" class="btn btn-primary" style="flex: 1.5; padding: 2px 4px; font-size: 11px; background: linear-gradient(90deg, #ff5722, #e91e63);">🖥️ 全屏滿版</button>
                </div>

                <!-- 水平與垂直位置滑桿 -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; margin-bottom: 2px;">
                    <label class="control-label" style="margin: 0;">↔️ 照片在靶內水平位移 (Pan X)：</label>
                    <span id="offsetXValLabel" style="font-size: 11px; color: #00e5ff; font-weight: bold;">0px</span>
                </div>
                <input type="range" id="imageOffsetXSlider" min="-500" max="500" step="5" value="0" style="width: 100%; accent-color: #00e5ff; cursor: pointer;">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; margin-bottom: 2px;">
                    <label class="control-label" style="margin: 0;">↕️ 照片在靶內垂直位移 (Pan Y)：</label>
                    <span id="offsetYValLabel" style="font-size: 11px; color: #00e5ff; font-weight: bold;">0px</span>
                </div>
                <input type="range" id="imageOffsetYSlider" min="-500" max="500" step="5" value="0" style="width: 100%; accent-color: #00e5ff; cursor: pointer;">

                <!-- 方向微調與居中重設 -->
                <div style="display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 8px;">
                    <button id="btnPosLeft" class="btn" style="padding: 2px 8px; font-size: 11px;" title="向左微調照片">⬅️</button>
                    <button id="btnPosUp" class="btn" style="padding: 2px 8px; font-size: 11px;" title="向上微調照片">⬆️</button>
                    <button id="btnPosCenter" class="btn btn-primary" style="padding: 2px 8px; font-size: 10px;" title="照片在靶內居中">🎯 照片居中</button>
                    <button id="btnPosDown" class="btn" style="padding: 2px 8px; font-size: 11px;" title="向下微調照片">⬇️</button>
                    <button id="btnPosRight" class="btn" style="padding: 2px 8px; font-size: 11px;" title="向右微調照片">➡️</button>
                </div>

                <div style="font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 6px; text-align: center;">
                    💡 提示：按住【滑鼠右鍵】可在靶框內直接拖曳調整照片顯示位置 (十字架靶身固定不動)！
                </div>

                <button id="btnTouchDragMode" class="btn" style="width: 100%; margin-top: 6px; padding: 5px; font-size: 11px; font-weight: 600;">
                    🖐️ 觸控滑動調整照片 (手機推薦)
                </button>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                    <label class="control-label" style="margin: 0;">裁切樣式：</label>
                    <select id="imageShapeSelect" style="padding: 3px 8px;">
                        <option value="circle">圓形裁切 (Circle)</option>
                        <option value="rect">原圖矩形 (Square/Rect)</option>
                    </select>
                </div>
            </div>

            <!-- 人偶配置切換 -->
            <div class="control-group">
                <div class="row-controls">
                    <label class="checkbox-label">
                        <input type="checkbox" id="fullBodyToggle"> 全身替換 (否則為替換頭像)
                    </label>
                </div>
            </div>

            <!-- 靶高度自由調整 (垂直升降) -->
            <div class="control-group" style="background: rgba(255, 152, 0, 0.06); padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255, 152, 0, 0.25);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <label class="control-label" style="margin: 0; color: #ff9800; font-weight: 600;">🗼 靶高度 (垂直升降)：</label>
                    <span id="targetHeightValLabel" style="font-size: 12px; font-weight: bold; color: #ff9800;">標準 (82%)</span>
                </div>
                <input type="range" id="targetHeightSlider" min="20" max="98" step="1" value="82" style="width: 100%; accent-color: #ff9800; cursor: pointer;">
            </div>

            <!-- 十字架數量與模式 -->
            <div class="control-group">
                <div class="row-controls">
                    <label class="control-label" style="margin:0;">靶子數量:</label>
                    <select id="targetCountSelect">
                        <option value="1">1 個十字架 (巨靶居中)</option>
                        <option value="2">2 個十字架</option>
                        <option value="3">3 個十字架</option>
                        <option value="5" selected>5 個十字架 (標準)</option>
                        <option value="7">7 個十字架 (擁擠)</option>
                        <option value="9">9 個十字架 (滿排)</option>
                    </select>
                </div>
            </div>

            <!-- 自動移動靶動態控制 (3D 空間移動) -->
            <div class="control-group" style="background: rgba(156, 39, 176, 0.08); padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(156, 39, 176, 0.3);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="control-label" style="margin: 0; color: #ba68c8; font-weight: 600;">🕹️ 自動移動靶 (3D空間)：</label>
                    <span id="moveSpeedValLabel" style="font-size: 11px; color: #ffcc00; font-weight: bold;">1.0x</span>
                </div>

                <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="moveHorizontalToggle"> ↔️ 水平左右移動 (X軸)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="moveVerticalToggle"> ↕️ 垂直上下移動 (Y軸)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="moveDepthToggle"> ↗️ 前後景深移動 (Z軸/拉近拉遠)
                    </label>
                </div>

                <!-- 速度與快速按鈕 -->
                <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
                    <span style="font-size: 10px; color: #8b949e;">速度:</span>
                    <input type="range" id="moveSpeedSlider" min="0.3" max="3.0" step="0.1" value="1.0" style="flex: 1; accent-color: #ba68c8; cursor: pointer;">
                </div>

                <div style="display: flex; gap: 6px;">
                    <button id="btnMoveCrazy" class="btn" style="flex: 1; padding: 2px 4px; font-size: 10px; background: rgba(233, 30, 99, 0.3); border-color: #e91e63;">🌪️ 狂暴全開</button>
                    <button id="btnMoveStop" class="btn" style="flex: 1; padding: 2px 4px; font-size: 10px;">⏹️ 停止歸位</button>
                </div>
            </div>

            <!-- 翻新修復 -->
            <div class="control-group" style="margin-bottom:0;">
                <button id="btnClean" class="btn btn-primary" style="width: 100%;">
                    🧹 一鍵修復 / 清洗靶場 (R鍵)
                </button>
            </div>
        </div>

        <!-- 右上角：打擊統計面板 -->
        <div id="statsPanel" class="panel">
            <div class="panel-title">
                <span>📊</span>
                <span>打擊數據</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">射擊次數:</span>
                <span id="statShots" class="stat-val">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">命中次數:</span>
                <span id="statHits" class="stat-val">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">爆頭次數 (HEADSHOT):</span>
                <span id="statHeadshots" class="stat-val headshot">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">命中率:</span>
                <span id="statAccuracy" class="stat-val">0%</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">累積輸出傷害:</span>
                <span id="statDamage" class="stat-val">0</span>
            </div>
        </div>

        <!-- 提示小標語 -->
        <div id="hotkeyTips">
            鍵盤 1~6 或滾輪切換武器 ｜ 按住滑鼠連射 ｜ R鍵快速翻新十字架 ｜ 可隨時拖放照片進來
        </div>

        <!-- 底部武器選擇欄 -->
        <div id="weaponBar" class="panel">
            <button class="weapon-btn active" data-weapon="pistol">
                <span class="weapon-key">1</span>
                <span class="weapon-icon">🔫</span>
                <span class="weapon-name">沙漠之鷹</span>
            </button>
            <button class="weapon-btn" data-weapon="smg">
                <span class="weapon-key">2</span>
                <span class="weapon-icon">⚡</span>
                <span class="weapon-name">衝鋒槍</span>
            </button>
            <button class="weapon-btn" data-weapon="shotgun">
                <span class="weapon-key">3</span>
                <span class="weapon-icon">💥</span>
                <span class="weapon-name">霰彈槍</span>
            </button>
            <button class="weapon-btn" data-weapon="tomato">
                <span class="weapon-key">4</span>
                <span class="weapon-icon">🍅</span>
                <span class="weapon-name">爛番茄</span>
            </button>
            <button class="weapon-btn" data-weapon="rpg">
                <span class="weapon-key">5</span>
                <span class="weapon-icon">🚀</span>
                <span class="weapon-name">火箭筒</span>
            </button>
            <button class="weapon-btn" data-weapon="laser">
                <span class="weapon-key">6</span>
                <span class="weapon-icon">🔮</span>
                <span class="weapon-name">雷射加農</span>
            </button>
        </div>

    </div>

    <!-- 腳本引入 -->
    <script src="audio.js"></script>
    <script src="weapons.js"></script>
    <script src="target.js"></script>
    <script src="game.js"></script>
</body>
</html>
