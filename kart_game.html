<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenClaw 賽車 (2D)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #333;
            max-width: 600px; /* 限制最大寬度，保持手機比例 */
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            z-index: 10;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
            border: 2px solid #ff4757;
            z-index: 20;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }
        /* 虛擬按鍵 */
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none; /* 讓點擊穿透到 canvas */
        }
        .btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            pointer-events: auto;
            user-select: none;
        }
        .btn:active { background: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>

    <div id="ui">
        Score: <span id="score">0</span>
    </div>

    <div id="gameOver">
        <h1>💥 車禍了!</h1>
        <p>最終分數: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">再跑一次</button>
    </div>

    <div id="controls">
        <div class="btn" id="btnLeft">⬅️</div>
        <div class="btn" id="btnRight">➡️</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        let width, height;
        let gameRunning = true;
        let score = 0;
        let speed = 5;
        let roadOffset = 0;

        // 玩家
        const player = {
            x: 0,
            y: 0,
            width: 50,
            height: 80,
            color: '#ff4757',
            vx: 0
        };

        // 敵人
        const enemies = [];
        const lanes = [0.25, 0.5, 0.75]; // 三個車道

        function resize() {
            width = Math.min(window.innerWidth, 600); // 限制遊戲區域寬度
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 150;
            player.x = width / 2 - player.width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 輸入控制 ---
        let leftPressed = false;
        let rightPressed = false;

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') leftPressed = true;
            if (e.key === 'ArrowRight') rightPressed = true;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') leftPressed = false;
            if (e.key === 'ArrowRight') rightPressed = false;
        });

        // 觸控按鈕
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        const handleStart = (dir) => (e) => { e.preventDefault(); if(dir==='l') leftPressed=true; else rightPressed=true; };
        const handleEnd = (dir) => (e) => { e.preventDefault(); if(dir==='l') leftPressed=false; else rightPressed=false; };

        btnLeft.addEventListener('touchstart', handleStart('l'));
        btnLeft.addEventListener('touchend', handleEnd('l'));
        btnLeft.addEventListener('mousedown', handleStart('l'));
        btnLeft.addEventListener('mouseup', handleEnd('l'));

        btnRight.addEventListener('touchstart', handleStart('r'));
        btnRight.addEventListener('touchend', handleEnd('r'));
        btnRight.addEventListener('mousedown', handleStart('r'));
        btnRight.addEventListener('mouseup', handleEnd('r'));


        // --- 遊戲邏輯 ---
        function spawnEnemy() {
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            const enemyW = 50;
            enemies.push({
                x: (width * lane) - enemyW/2, // 修正車道位置
                y: -100,
                width: enemyW,
                height: 80,
                color: Math.random() > 0.5 ? '#1e90ff' : '#ffa502',
                speed: speed * (0.5 + Math.random() * 0.3) // 敵人速度比我慢
            });
        }

        function update() {
            if (!gameRunning) return;

            // 加速
            speed += 0.005; // 隨時間越來越快
            roadOffset += speed;
            if (roadOffset > 100) roadOffset = 0; // 循環路面貼圖

            // 玩家移動
            if (leftPressed) player.x -= 7;
            if (rightPressed) player.x += 7;

            // 邊界限制
            if (player.x < 20) player.x = 20; // 路肩
            if (player.x > width - player.width - 20) player.x = width - player.width - 20;

            // 生成敵人
            if (Math.random() < 0.02) spawnEnemy();

            // 更新敵人
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += speed; // 相對速度

                if (e.y > height) {
                    enemies.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                }

                // 碰撞檢測 (AABB)
                if (
                    player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y
                ) {
                    gameOver();
                }
            }
        }

        function drawCar(x, y, w, h, color) {
            ctx.fillStyle = color;
            // 車身
            ctx.fillRect(x, y, w, h);
            // 擋風玻璃
            ctx.fillStyle = '#333';
            ctx.fillRect(x + 5, y + 10, w - 10, 15);
            ctx.fillRect(x + 5, y + h - 20, w - 10, 10);
            // 輪胎
            ctx.fillStyle = 'black';
            ctx.fillRect(x - 5, y + 10, 5, 20);
            ctx.fillRect(x + w, y + 10, 5, 20);
            ctx.fillRect(x - 5, y + h - 30, 5, 20);
            ctx.fillRect(x + w, y + h - 30, 5, 20);
        }

        function render() {
            // 背景 (草地)
            ctx.fillStyle = '#006400';
            ctx.fillRect(0, 0, width, height);

            // 道路
            const roadW = width - 40;
            const roadX = 20;
            ctx.fillStyle = '#555';
            ctx.fillRect(roadX, 0, roadW, height);

            // 路肩 (紅白相間)
            const stripH = 50;
            for(let i = -stripH; i < height; i+=stripH*2) {
                const y = (i + roadOffset) % (height + stripH) - stripH;
                ctx.fillStyle = '#fff';
                ctx.fillRect(roadX - 10, y, 10, stripH);
                ctx.fillRect(roadX + roadW, y, 10, stripH);
                ctx.fillStyle = '#c00';
                ctx.fillRect(roadX - 10, y + stripH, 10, stripH);
                ctx.fillRect(roadX + roadW, y + stripH, 10, stripH);
            }

            // 車道線
            ctx.strokeStyle = 'white';
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -roadOffset;
            ctx.lineWidth = 5;
            
            // 畫兩條車道線
            ctx.beginPath();
            ctx.moveTo(width * 0.33, 0);
            ctx.lineTo(width * 0.33, height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(width * 0.66, 0);
            ctx.lineTo(width * 0.66, height);
            ctx.stroke();
            
            ctx.setLineDash([]); // Reset

            // 畫敵人
            enemies.forEach(e => drawCar(e.x, e.y, e.width, e.height, e.color));

            // 畫玩家
            drawCar(player.x, player.y, player.width, player.height, player.color);
            
            // 尾燈特效
            ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
            ctx.beginPath();
            ctx.arc(player.x + 10, player.y + player.height, 5 + Math.random()*5, 0, Math.PI*2);
            ctx.arc(player.x + player.width - 10, player.y + player.height, 5 + Math.random()*5, 0, Math.PI*2);
            ctx.fill();
        }

        function loop() {
            update();
            render();
            if (gameRunning) requestAnimationFrame(loop);
        }

        function gameOver() {
            gameRunning = false;
            finalScoreEl.innerText = score;
            gameOverEl.style.display = 'block';
        }

        function resetGame() {
            score = 0;
            speed = 5;
            enemies.length = 0;
            player.x = width / 2 - player.width / 2;
            gameOverEl.style.display = 'none';
            scoreEl.innerText = '0';
            gameRunning = true;
            loop();
        }

        loop();

    </script>
</body>
</html>
